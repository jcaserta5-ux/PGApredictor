# Fly.io configuration for PGA Predictor backend
app = "pga-predictor-api"
primary_region = "iad"

[env]
  FLASK_ENV = "production"

[[services]]
  internal_port = 8080
  processes = ["app"]
  protocol = "tcp"

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.http_checks]
    enabled = true
    grace_period = "10s"
    interval = "30s"
    timeout = "5s"
    path = "/api/health"
